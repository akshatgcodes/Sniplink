<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sniplink{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">Sniplink</a>
    <nav>
      <a href="{{ url_for('index') }}">Shorten</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <p>Sniplink &mdash; self-hosted URL shortener with free link expiry &amp; QR codes.</p>
  </footer>
</body>
</html>
